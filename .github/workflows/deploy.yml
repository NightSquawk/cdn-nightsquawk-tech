name: Deploy

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          pnpm run typecheck
          pnpm test
      # Pull requests only validate; publishing needs the Cloudflare secrets.
      - name: Publish
        if: github.event_name != 'pull_request'
        run: pnpm run deploy
        env:
          # The target account is pinned by account_id in wrangler.toml.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
